name: Deploy BioCart to Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (frontend + functions)
        run: |
          npm ci
          npm --prefix functions ci

      - name: Type-check frontend and functions
        run: |
          npx tsc --noEmit
          npm --prefix functions exec tsc -- --noEmit

      - name: Backend money-flow tests (real compiled functions, external APIs mocked)
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Browser checkout smoke test (desktop + mobile)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: test-results/

  deploy_production:
    needs: validate_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Authenticate to Google Cloud
        if: env.HAS_SA == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART }}

      - name: Deploy rules, indexes, storage, functions and hosting
        if: env.HAS_SA == 'true'
        run: npx firebase-tools@14 deploy --only firestore,storage,functions,hosting --project bio-cart --non-interactive --force
