name: Deploy BioCart to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Build Production Frontend
        run: npm run build

      - name: Build Cloud Functions
        run: |
          cd functions
          npm ci
          npm run build
          cd ..

      - name: Deploy Firebase Rules, Storage and Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          npx firebase-tools deploy --only functions,firestore,storage --project bio-cart --non-interactive
        continue-on-error: true

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART }}
          channelId: live
          projectId: bio-cart
