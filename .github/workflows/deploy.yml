name: Deploy BioCart to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Production Frontend
        run: npm run build

      - name: Build Cloud Functions
        run: |
          cd functions
          npm ci
          npm run build
          cd ..

  deploy_production:
    needs: validate_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build
          cd functions && npm ci && npm run build && cd ..

      - name: Authenticate to Google Cloud
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART }}

      - name: Deploy Firebase Rules, Storage and Functions
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART != '' }}
        run: |
          npx firebase-tools deploy --only firestore,storage,functions --project bio-cart --non-interactive

      - name: Deploy to Firebase Hosting
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIO_CART }}
          channelId: live
          projectId: bio-cart
